title: PowerShell Encoded Command Execution
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: |
  Detects execution of PowerShell with the -EncodedCommand parameter, which is
  frequently used by attackers to obfuscate malicious commands and bypass simple
  string-based defences.

  While some legitimate tools and scripts use encoded commands, the combination
  with other suspicious parameters (e.g. -NonInteractive, -WindowStyle Hidden)
  significantly increases confidence.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_powershell_exe
  - https://github.com/danielbohannon/Invoke-Obfuscation
author: SOC Home Lab
date: 2025/01/01
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1027
logsource:
  product: windows
  service: sysmon
  definition: 'Requires Sysmon installed with process command line logging enabled'
detection:
  selection_base:
    EventID: 1
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_encoded:
    CommandLine|contains:
      - ' -EncodedCommand '
      - ' -encodedcommand '
      - ' -enc '
      - ' -EC '
  selection_suspicious_flags:
    CommandLine|contains:
      - '-NonI'
      - '-NonInteractive'
      - '-W Hidden'
      - '-WindowStyle Hidden'
      - '-Exec Bypass'
      - '-ExecutionPolicy Bypass'
  filter_legitimate:
    # Known legitimate software using encoded commands
    ParentImage|endswith:
      - '\MsiExec.exe'
      - '\svchost.exe'
    CommandLine|contains:
      - 'MSFT_'  # Microsoft management scripts
  condition: (selection_base and selection_encoded) or (selection_base and selection_suspicious_flags and 2 of selection_*)
falsepositives:
  - Some legitimate enterprise software uses encoded PowerShell commands for installation
  - Configuration management tools (Ansible WinRM, Chef, Puppet)
  - SCCM/Endpoint Manager scripts
level: high
