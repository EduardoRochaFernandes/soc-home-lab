---
# deploy-wazuh-agents.yml
# Installs and registers Wazuh agents on all Linux target hosts
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml deploy-wazuh-agents.yml
#   ansible-playbook -i inventory/hosts.yml deploy-wazuh-agents.yml --limit linux-victim

- name: Deploy Wazuh Agent to Linux Hosts
  hosts: linux_agents
  become: true
  vars:
    wazuh_version: "4.7.0"
    wazuh_manager: "{{ wazuh_manager_ip }}"
    wazuh_agent_group: "linux-victims"

  tasks:
    - name: Add Wazuh GPG key
      ansible.builtin.shell: |
        curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH | \
        gpg --dearmor -o /usr/share/keyrings/wazuh.gpg
      args:
        creates: /usr/share/keyrings/wazuh.gpg

    - name: Add Wazuh apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
        state: present
        filename: wazuh

    - name: Install Wazuh agent
      ansible.builtin.apt:
        name: wazuh-agent
        state: present
        update_cache: yes
      environment:
        WAZUH_MANAGER: "{{ wazuh_manager }}"
        WAZUH_AGENT_GROUP: "{{ wazuh_agent_group }}"

    - name: Configure Wazuh agent
      ansible.builtin.template:
        src: templates/ossec.conf.j2
        dest: /var/ossec/etc/ossec.conf
        owner: root
        group: wazuh
        mode: '0640'
      notify: restart wazuh-agent

    - name: Enable and start Wazuh agent
      ansible.builtin.systemd:
        name: wazuh-agent
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Verify agent is connected
      ansible.builtin.command: /var/ossec/bin/wazuh-control status
      register: wazuh_status
      changed_when: false

    - name: Show agent status
      ansible.builtin.debug:
        var: wazuh_status.stdout_lines

  handlers:
    - name: restart wazuh-agent
      ansible.builtin.systemd:
        name: wazuh-agent
        state: restarted
