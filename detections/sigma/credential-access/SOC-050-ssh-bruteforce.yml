title: SSH Failed Password Attempt
name: ssh_failed_password
id: 3f8d2a1c-9b4e-4f7a-8c2d-1e5f6a3b9c8d
status: experimental
description: |
  Detects a high rate of failed SSH authentication attempts from a single source IP,
  indicating a brute-force or password spraying attack against SSH.

  Attackers use SSH brute force to gain initial access or move laterally to systems
  with SSH exposed, targeting weak credentials, default passwords, or known usernames.
references:
  - https://attack.mitre.org/techniques/T1110/001/
  - https://www.cisa.gov/uscert/ncas/alerts/aa22-054a
author: SOC Home Lab
date: 2025/01/01
tags:
  - attack.credential-access
  - attack.t1110.001
logsource:
  product: linux
  service: auth
detection:
  selection:
    program: sshd
    message|contains: 'Failed password'
  condition: selection
falsepositives:
  - Misconfigured SSH client with incorrect credentials
  - Automated scripts with hardcoded wrong credentials
  - Authorized penetration testing (document in change management log)
level: high
---
title: SSH Brute Force Attack
id: 7b1e4c52-6a0d-4d8e-9f3a-2c5d8e1a4b70
status: experimental
description: More than 5 failed SSH password attempts from one source IP within 60 seconds.
author: SOC Home Lab
date: 2025/01/01
tags:
  - attack.credential-access
  - attack.t1110.001
correlation:
  type: event_count
  rules:
    - ssh_failed_password
  group-by:
    - src_ip
  timespan: 60s
  condition:
    gt: 5
level: high
