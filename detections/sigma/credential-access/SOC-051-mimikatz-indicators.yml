title: Mimikatz LSASS Memory Access
id: c2d3e4f5-a6b7-8901-cdef-234567890abc
status: experimental
description: |
  Detects process access to LSASS (lsass.exe) with access rights commonly used
  by Mimikatz and similar credential dumping tools to extract credentials from
  Windows memory.

  The GrantedAccess value 0x1010 corresponds to PROCESS_VM_READ | PROCESS_QUERY_LIMITED_INFORMATION,
  which is the access mask Mimikatz uses by default.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://github.com/gentilkiwi/mimikatz
  - https://blog.3or.de/hunting-mimikatz-with-sysmon-monitoring.html
author: SOC Home Lab
date: 2025/01/01
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  service: sysmon
  definition: 'Requires Sysmon Event ID 10 — Process Access logging'
detection:
  selection:
    EventID: 10
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1418'
      - '0x1f0fff'
      - '0x1f1fff'
      - '0x1f2fff'
      - '0x1f3fff'
  filter_legitimate:
    SourceImage|endswith:
      - '\MsMpEng.exe'       # Windows Defender
      - '\svchost.exe'
      - '\taskmgr.exe'
      - '\csrss.exe'
      - '\werfault.exe'      # Windows Error Reporting
      - '\WmiPrvSE.exe'
    GrantedAccess: '0x1010'
  condition: selection and not filter_legitimate
falsepositives:
  - Security products performing memory scanning (AV, EDR)
  - Windows system components accessing LSASS for legitimate purposes
  - Debugging tools used by developers on dev machines (not production)
level: critical
