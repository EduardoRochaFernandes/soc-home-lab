title: Windows Security Event Log Cleared
id: b9c8d7e6-f5a4-3b2c-1d0e-9f8a7b6c5d4e
status: stable
description: |
  Detects the clearing of the Windows Security or System event log, indicated by
  Event ID 1102 (Security log) or 104 (System log). This is a strong indicator
  of an attacker attempting to cover their tracks after a compromise.

  This is a high-confidence detection — legitimate clearing of event logs by
  administrators should be extremely rare and always documented.
references:
  - https://attack.mitre.org/techniques/T1070/001/
  - https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-1102
author: SOC Home Lab
date: 2025/01/01
tags:
  - attack.defense_evasion
  - attack.t1070.001
logsource:
  product: windows
  service: security
detection:
  selection_security_cleared:
    EventID: 1102
  selection_system_cleared:
    EventID: 104
    Provider_Name: 'Microsoft-Windows-Eventlog'
  condition: 1 of selection_*
falsepositives:
  - Scheduled log rotation by administrators (should be documented in change management)
  - Forensic response teams clearing logs after incident remediation
level: critical
