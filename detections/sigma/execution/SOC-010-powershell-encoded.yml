title: PowerShell Encoded Command Execution
id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
status: experimental
description: |
  Detects execution of PowerShell with the -EncodedCommand parameter, which is
  frequently used by attackers to obfuscate malicious commands and bypass simple
  string-based defences.

  While some legitimate tools and scripts use encoded commands, they should be
  rare on a lab endpoint. Hunting tip: pivot on additional flags such as
  -NonInteractive, -WindowStyle Hidden or -ExecutionPolicy Bypass to raise confidence.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://docs.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_powershell_exe
  - https://github.com/danielbohannon/Invoke-Obfuscation
author: SOC Home Lab
date: 2025/01/01
tags:
  - attack.execution
  - attack.t1059.001
  - attack.defense-evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
  definition: 'Requires Sysmon Event ID 1 (or Security 4688) with command line logging enabled'
detection:
  selection_base:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_encoded:
    CommandLine|contains:
      - ' -EncodedCommand '
      - ' -encodedcommand '
      - ' -enc '
      - ' -EC '
  filter_legitimate:
    # Known legitimate software using encoded commands
    ParentImage|endswith:
      - '\MsiExec.exe'
      - '\svchost.exe'
    CommandLine|contains:
      - 'MSFT_'  # Microsoft management scripts
  condition: selection_base and selection_encoded and not filter_legitimate
falsepositives:
  - Some legitimate enterprise software uses encoded PowerShell commands for installation
  - Configuration management tools (Ansible WinRM, Chef, Puppet)
  - SCCM/Endpoint Manager scripts
level: high
