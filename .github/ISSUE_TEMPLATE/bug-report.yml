name: "🐛 Bug Report"
description: Report a broken configuration, rule, or script
title: "[Bug] <Short description>"
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Wazuh Manager
        - Wazuh Agent (Windows)
        - Wazuh Agent (Linux)
        - Elasticsearch
        - Kibana
        - Logstash
        - Suricata
        - TheHive
        - Cortex
        - MISP
        - Ansible playbooks
        - Detection rules (Sigma)
        - Detection rules (Wazuh XML)
        - Detection rules (Suricata)
        - Python tools
        - Documentation
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - Component version:
        - Host RAM:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell
