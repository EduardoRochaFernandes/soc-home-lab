[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tools/ioc-enricher/ioc_enricher.py" = ["E401", "I001"]
"infrastructure/scripts/create_github_issues.py" = ["I001", "W291", "W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]
